<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="350" viewBox="0 0 1440 350" role="img" aria-labelledby="title desc">
<title id="title">From scattered reports to a traceable register</title><desc id="desc">Receive CSV or Excel reports, review validation and proposed changes, confirm an accepted batch, and trace source records and history.</desc>
<rect width="1440" height="350" rx="16" fill="#101013"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="48" y="60" fill="#f2ede7" font-size="28" font-weight="600">A clear path from a file to a record you can explain.</text>
<path d="M70 138H1370" stroke="#5c303d" stroke-width="2"/>
<g fill="#b72e48"><circle cx="70" cy="138" r="23"/><circle cx="420" cy="138" r="23"/><circle cx="770" cy="138" r="23"/><circle cx="1120" cy="138" r="23"/></g>
<g fill="#fff8f5" font-size="22" text-anchor="middle"><text x="70" y="146">1</text><text x="420" y="146">2</text><text x="770" y="146">3</text><text x="1120" y="146">4</text></g>
<g fill="#f2ede7" font-size="32" font-weight="600"><text x="48" y="208">Receive</text><text x="398" y="208">Review</text><text x="748" y="208">Confirm</text><text x="1098" y="208">Trace</text></g>
<g fill="#b3adb0" font-size="23"><text x="48" y="255">CSV, Excel or a</text><text x="48" y="287">connected source</text><text x="398" y="255">Check errors and</text><text x="398" y="287">see proposed changes</text><text x="748" y="255">A person approves</text><text x="748" y="287">the accepted update</text><text x="1098" y="255">Keep the source,</text><text x="1098" y="287">timestamps and history</text></g>
</g></svg>
