name: Build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

  backend:
    name: API, permissions and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sampati
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: sampati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sampati -d sampati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sampati:disposable_ci_password@127.0.0.1:5432/sampati_test
      TEST_DATABASE_URL: postgresql+psycopg://sampati:disposable_ci_password@127.0.0.1:5432/sampati_test
      PREVIEW_SECRET: ci_only_preview_signing_secret_at_least_32_characters
      SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: python -m pip check
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m alembic -c backend/alembic.ini check
      - run: python -m pytest backend/tests -q
